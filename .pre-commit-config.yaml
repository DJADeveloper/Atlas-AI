# Pre-commit hooks run the SAME uv-locked toolchain as CI (scripts/ci/*.sh),
# so hook and pipeline versions can never drift — the reason for `repo: local`
# over marketplace hook repos (docs/53-cicd-strategy.md, developer-loop parity).
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project apps/api ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run --project apps/api ruff check --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd apps/api && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false

      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
