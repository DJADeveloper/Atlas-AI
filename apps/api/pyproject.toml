[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas API - the local-first AI Operating System backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "redis>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "asgi-lifespan>=2.1",
  "mypy>=1.13",
  "ruff>=0.8",
  "testcontainers>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # comprehensions
  "DTZ",         # naive datetimes
  "SIM",         # simplify
  "PTH",         # pathlib
  "PL",          # pylint
  "RUF",         # ruff-specific
  "ASYNC",       # async pitfalls
  "S",           # bandit
]

[tool.ruff.lint.per-file-ignores]
# Test code idioms, configured here rather than as inline suppressions:
# S101 - pytest uses bare assert; PLR2004 - literal expectations are the point.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
pretty = true
show_error_codes = true

# Third-party packages without type information. Every entry here MUST be
# documented in mypy-allowlist.md with the reason and upstream reference.
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a container runtime (testcontainers); excluded from the default fast run",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["atlas"]
