[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas API - the local-first AI Operating System backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "redis>=5.2",
  "structlog>=26.1.0",
  "alembic>=1.18.5",
  "pgvector>=0.5.0",
  "pymupdf>=1.28.0",
  "celery[redis]>=5.6.3",
  "watchfiles>=1.2.0",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "asgi-lifespan>=2.1",
  "mypy>=1.13",
  "ruff>=0.8",
  "testcontainers>=4.9",
  "import-linter>=2.13",
  "celery-types>=0.26.0",
  "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# N818 is disabled as policy: the domain error taxonomy is spec-named
# (NotFound, Conflict, PermissionDenied, ... - docs/60-milestones.md M02);
# renaming spec types to satisfy a suffix convention inverts priorities.
ignore = ["N818"]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # comprehensions
  "DTZ",         # naive datetimes
  "SIM",         # simplify
  "PTH",         # pathlib
  "PL",          # pylint
  "RUF",         # ruff-specific
  "ASYNC",       # async pitfalls
  "S",           # bandit
]

[tool.ruff.lint.pylint]
# Keyword-only factory/constructor signatures legitimately reach six.
max-args = 6

[tool.ruff.lint.per-file-ignores]
# Test code idioms, configured here rather than as inline suppressions:
# S101 - pytest uses bare assert; PLR2004 - literal expectations are the
# point; S311 - seeded random builds deterministic fixtures, not secrets.
"tests/**" = ["S101", "PLR2004", "ASYNC240", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
pretty = true
show_error_codes = true

# Third-party packages without type information. Every entry here MUST be
# documented in mypy-allowlist.md with the reason and upstream reference.
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "atlas.infrastructure.parsing.pdf_parser"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.unit.test_parsers", "tests.integration.test_ingestion_flow", "tests.pdfgen"]
disallow_untyped_calls = false
disable_error_code = ["attr-defined", "no-any-return"]

[tool.importlinter]
root_packages = ["atlas"]
include_external_packages = true

# ADR-0002 made mechanical: violations fail CI, not code review.
[[tool.importlinter.contracts]]
name = "Clean Architecture layer ordering"
type = "layers"
layers = ["atlas.presentation", "atlas.application", "atlas.rag", "atlas.domain"]

[[tool.importlinter.contracts]]
name = "Domain and shared stay framework-free"
type = "forbidden"
source_modules = ["atlas.domain", "atlas.shared", "atlas.rag"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic_settings",
  "sqlalchemy",
  "redis",
  "structlog",
  "uvicorn",
  "atlas.presentation",
  "atlas.config",
  "atlas.observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a container runtime (testcontainers); excluded from the default fast run",
  "slow: long-running E2E suites; nightly CI only",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["atlas"]
