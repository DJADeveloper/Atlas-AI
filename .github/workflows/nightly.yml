# Nightly suites (docs/53): long-running E2E that would blow the PR
# budget — the 1,000-file corpus (M04), the live nomic-embed-text
# adapter check and the throughput benchmark (M05), the golden-dataset
# retrieval eval and search latency harness (M06); the formal eval
# trend gate joins at M11.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_OLLAMA_URL: http://127.0.0.1:11434
      # Live provider contract test (M07). Until the repo secret exists
      # this evaluates to empty and the suite skips itself, visibly.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --project apps/api
      - name: Start Ollama and pull nomic-embed-text
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -fsS "$ATLAS_OLLAMA_URL/api/version" && break
            sleep 1
          done
          ollama pull nomic-embed-text
      - run: scripts/ci/test-e2e.sh
      - name: Throughput benchmark (real model)
        run: |
          cd apps/api
          uv run python scripts/ingest_throughput.py \
            --docs 300 --provider ollama --output benchmark.json
      - name: Retrieval golden eval (real model)
        run: |
          cd apps/api
          uv run python scripts/retrieval_eval.py \
            --provider ollama --output retrieval_eval.json
      - name: Search latency harness (10k chunks, 200 requests)
        run: |
          cd apps/api
          uv run python scripts/search_latency.py \
            --provider ollama --output search_latency.json
      - name: First-token latency harness (M07; needs ANTHROPIC_API_KEY)
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          cd apps/api
          uv run python scripts/chat_latency.py \
            --provider anthropic --output chat_latency.json
      - name: Grounded-answer eval (M08; needs ANTHROPIC_API_KEY)
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          cd apps/api
          uv run python scripts/grounded_eval.py \
            --chat anthropic --output grounded_eval.json
      - uses: actions/upload-artifact@v7
        with:
          name: ingest-throughput-benchmark
          path: apps/api/benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-quality
          path: |
            apps/api/retrieval_eval.json
            apps/api/search_latency.json
      - uses: actions/upload-artifact@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: chat-first-token-latency
          path: apps/api/chat_latency.json
      - uses: actions/upload-artifact@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          name: grounded-answer-quality
          path: apps/api/grounded_eval.json
