# Atlas development stack (docs/40-deployment-architecture.md §2).
# Profiles per spine §3: core | observability | full.
# `core` runs postgres, redis, api, worker (M04); `web` joins at M09,
# the observability services at M10, ollama at M12. The api and worker
# mount ./sandbox at /data read-only — register dev sources under /data.
#
# Files dropped into the UI are written by the api and read by the
# worker, which are separate containers: they share one writable volume
# at ATLAS_UPLOADS_DIR. Mounting it in only one of them strands every
# upload, so the two services must always be changed together.
#
# Images are digest-pinned (M01 risk mitigation: compose drift). To bump:
# update the tag AND digest together, in one reviewed commit.
#
# Host ports bind to 127.0.0.1 only — nothing Atlas runs is reachable from
# the network (docs/30-security-architecture.md, secure defaults).

name: atlas

services:
  postgres:
    # pgvector/pgvector:pg16
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    profiles: [core, full]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas # local development only; never a deployed credential
      POSTGRES_DB: atlas
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # redis:7-alpine
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: [core, full]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atlas-redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    profiles: [core, full]
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_RUN_MIGRATIONS_ON_STARTUP: "true"  # docs/40 §2.2; workers never migrate
      ATLAS_UPLOADS_DIR: /var/lib/atlas/uploads  # shared with the worker
    # Dev loop: source bind-mounted, uvicorn reloads on change
    # (docs/40-deployment-architecture.md §2.2).
    command:
      [
        "uvicorn",
        "--factory",
        "atlas.presentation.app:create_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ../../apps/api/src:/app/src
      - ../../sandbox:/data:ro
      - atlas-uploads:/var/lib/atlas/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    profiles: [core, full]
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_REDIS_URL: redis://redis:6379/0
      # Ollama runs on the HOST (local-first: models live with the user's
      # data, not in the stack); host-gateway reaches it from the container.
      ATLAS_OLLAMA_URL: http://host.docker.internal:11434
      ATLAS_UPLOADS_DIR: /var/lib/atlas/uploads  # must match the api's
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "celery",
        "-A",
        "atlas.infrastructure.jobs.worker",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "ingest.parse,ingest.embed,chat.background",
      ]
    volumes:
      - ../../apps/api/src:/app/src
      - ../../sandbox:/data:ro
      - atlas-uploads:/var/lib/atlas/uploads
    # A worker that is up but not consuming looks identical to one that
    # is still starting; the ping makes the difference visible to
    # `docker ps` instead of leaving a container spinning forever.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A atlas.infrastructure.jobs.worker inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  atlas-pgdata:
  atlas-redisdata:
  atlas-uploads:
