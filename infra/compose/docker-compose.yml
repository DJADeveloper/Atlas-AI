# Atlas development stack (docs/40-deployment-architecture.md §2).
# Profiles per spine §3: core | observability | full.
# M01 populates `core` with postgres, redis, api; `worker` joins at M04,
# `web` at M09, the observability services at M10, ollama at M12.
#
# Images are digest-pinned (M01 risk mitigation: compose drift). To bump:
# update the tag AND digest together, in one reviewed commit.
#
# Host ports bind to 127.0.0.1 only — nothing Atlas runs is reachable from
# the network (docs/30-security-architecture.md, secure defaults).

name: atlas

services:
  postgres:
    # pgvector/pgvector:pg16
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    profiles: [core, full]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas # local development only; never a deployed credential
      POSTGRES_DB: atlas
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # redis:7-alpine
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: [core, full]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atlas-redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    profiles: [core, full]
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_REDIS_URL: redis://redis:6379/0
    # Dev loop: source bind-mounted, uvicorn reloads on change
    # (docs/40-deployment-architecture.md §2.2).
    command:
      [
        "uvicorn",
        "--factory",
        "atlas.presentation.app:create_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ../../apps/api/src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  atlas-pgdata:
  atlas-redisdata:
